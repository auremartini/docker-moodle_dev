version: "2"

services:
  moodle_docker-db:
    image: mariadb:10.4
    container_name: moodle_docker-db
    environment:
      - MARIADB_ROOT_PASSWORD=uTk79mgR6Up2
      - MARIADB_USER=moodle-user
      - MARIADB_PASSWORD=H463XYPpU0GG
      - MARIADB_DATABASE=moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    volumes:
      - ./dbdata:/var/lib/mysql
    networks:
      - moodle_docker_default

  moodle_docker-adminer:
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      moodle_docker-db:
        condition: service_started
    ports:
      - 7777:8080
    networks:
      - moodle_docker_default

  moodle_docker-app:
    build:
      context: PHP/
      dockerfile: PHP.Dockerfile
    restart: always
    container_name: docker_moodle-app
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata:rw
      - ./conf/local.ini:/usr/local/etc/php/php.ini
    networks:
      - moodle_docker_default
    depends_on:
      - moodle_docker-db

  moodle_docker-web:
    image: nginx
    restart: always
    container_name: moodle_docker-web
    ports:
      - 70:80
      - 8088:8088
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    volumes_from:
      - moodle_docker-app
    networks:
      - moodle_docker_default

  moodle_docker-cron:
    container_name: moodle_docker-cron
    build:
      context: Cron/
      dockerfile: Cron.Dockerfile
    restart: always
    volumes:
      - ./log/cron:/var/log/cron
    volumes_from:
      - moodle_docker-app
    networks:
      - moodle_docker_default
    depends_on:
      - moodle_docker-db
      - moodle_docker-app

networks:
  moodle_docker_default:
      external: false